# Edge-Drop rules
windowrulev2 = float, class:^(edge-drop)$
windowrulev2 = pin, class:^(edge-drop)$
windowrulev2 = move 2176 0, class:^(edge-drop)$
windowrulev2 = noborder, class:^(edge-drop)$
windowrulev2 = noshadow, class:^(edge-drop)$
windowrulev2 = rounding 0, class:^(edge-drop)$
windowrulev2 = noanim, class:^(edge-drop)$
windowrulev2 = noblur, class:^(edge-drop)$
windowrulev2 = noinitialfocus, class:^(edge-drop)$

# Flameshot
windowrulev2 = float, class:^(flameshot)$
windowrulev2 = center, class:^(flameshot)$
windowrulev2 = noborder, class:^(flameshot)$
windowrulev2 = noshadow, class:^(flameshot)$
windowrulev2 = rounding 0, class:^(flameshot)$
windowrulev2 = suppressevent fullscreen, class:^(flameshot)$

# Share picker & Portals (Floating)
windowrulev2 = float, class:^(hyprland-share-picker)$
windowrulev2 = center, class:^(hyprland-share-picker)$
windowrulev2 = pin, class:^(hyprland-share-picker)$
windowrulev2 = float, class:^(.*portal.*)$
windowrulev2 = center, class:^(.*portal.*)$
